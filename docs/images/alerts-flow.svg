<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490"><defs><pattern id="d" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1f2937"/></pattern></defs><rect width="1200" height="490" rx="20" fill="#0b0f1c"/><rect width="1200" height="490" rx="20" fill="url(#d)"/><text x="40" y="48" fill="#e5e7eb" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="22" font-weight="800" text-anchor="start"  xml:space="preserve">Alerts: a query that returns rows = a notification</text><text x="40" y="74" fill="#9ca3af" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="13" font-weight="400" text-anchor="start"  xml:space="preserve">alerts/*.yaml · refresh on a cron · notify Slack or email</text><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.0s" dur=".5s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="0.0s" dur=".5s" fill="freeze"/><rect x="40" y="100" width="1120" height="96" rx="14" fill="#111827" stroke="#f87171" stroke-width="1.6" /><rect x="40" y="100" width="7" height="96" rx="3" fill="#f87171"/><text x="70" y="138" fill="#f87171" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="16" font-weight="800" text-anchor="start"  xml:space="preserve">duplicate_orders.yaml</text><text x="70" y="166" fill="#9ca3af" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12.5" font-weight="400" text-anchor="start"  xml:space="preserve">every hour</text><text x="400" y="138" fill="#9ca3af" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start"  xml:space="preserve">fires when</text><text x="400" y="164" fill="#e5e7eb" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" text-anchor="start"  xml:space="preserve">same order_id + branch + day more than once</text><text x="1140" y="138" fill="#9ca3af" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="end"  xml:space="preserve">→ notify</text><text x="1140" y="164" fill="#f87171" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="14" font-weight="700" text-anchor="end"  xml:space="preserve">#data-alerts (Slack)</text></g><circle cx="1000" cy="120" r="5" fill="#f87171"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" begin="0.0s" repeatCount="indefinite"/></circle><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.4s" dur=".5s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="0.4s" dur=".5s" fill="freeze"/><rect x="40" y="218" width="1120" height="96" rx="14" fill="#111827" stroke="#fbbf24" stroke-width="1.6" /><rect x="40" y="218" width="7" height="96" rx="3" fill="#fbbf24"/><text x="70" y="256" fill="#fbbf24" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="16" font-weight="800" text-anchor="start"  xml:space="preserve">data_freshness.yaml</text><text x="70" y="284" fill="#9ca3af" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12.5" font-weight="400" text-anchor="start"  xml:space="preserve">every 3 hours</text><text x="400" y="256" fill="#9ca3af" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start"  xml:space="preserve">fires when</text><text x="400" y="282" fill="#e5e7eb" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" text-anchor="start"  xml:space="preserve">no new orders for over a day</text><text x="1140" y="256" fill="#9ca3af" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="end"  xml:space="preserve">→ notify</text><text x="1140" y="282" fill="#fbbf24" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="14" font-weight="700" text-anchor="end"  xml:space="preserve">#data-alerts (Slack)</text></g><circle cx="1000" cy="238" r="5" fill="#fbbf24"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" begin="0.5s" repeatCount="indefinite"/></circle><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.8s" dur=".5s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="0.8s" dur=".5s" fill="freeze"/><rect x="40" y="336" width="1120" height="96" rx="14" fill="#111827" stroke="#34d399" stroke-width="1.6" /><rect x="40" y="336" width="7" height="96" rx="3" fill="#34d399"/><text x="70" y="374" fill="#34d399" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="16" font-weight="800" text-anchor="start"  xml:space="preserve">target_achieved.yaml</text><text x="70" y="402" fill="#9ca3af" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12.5" font-weight="400" text-anchor="start"  xml:space="preserve">every morning 9:00</text><text x="400" y="374" fill="#9ca3af" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start"  xml:space="preserve">fires when</text><text x="400" y="400" fill="#e5e7eb" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" text-anchor="start"  xml:space="preserve">branch revenue ≥ monthly target</text><text x="1140" y="374" fill="#9ca3af" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="end"  xml:space="preserve">→ notify</text><text x="1140" y="400" fill="#34d399" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="14" font-weight="700" text-anchor="end"  xml:space="preserve">owner (email)</text></g><circle cx="1000" cy="356" r="5" fill="#34d399"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" begin="1.0s" repeatCount="indefinite"/></circle><text x="600" y="470" fill="#9ca3af" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle"  xml:space="preserve">In this sample data the target alert fires for Viman Nagar (₹1.94L vs ₹1.80L target); the other two return no rows</text></svg>